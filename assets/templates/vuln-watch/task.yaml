# Template: check of security feeds for vulnerabilities that affect
# inventoried products. Install with 'ais templates use vuln-watch' and
# adjust sinks and schedule.
version: 1
name: vuln-watch
description: Check of security feeds for vulnerabilities affecting inventoried products, hourly in the publication peak.
enabled: true
# Feed checks every 20 minutes from 06 to 22; a check without a new feed
# item starts no container and costs nothing. Nothing runs in the night;
# the first check of the day picks the night up. feeds.maxRunsPerDay caps
# the checks that start the model. Times are in scheduler.timezone.
schedule: "7,27,47 6-22 * * *"
jitter: 3m
overlap: skip
timeout: 20m
model: claude-opus-5-5
effort: high                  # low | medium | high | xhigh | max
maxTurns: 40
maxBudgetUsd: 3.00

# One entry per system (mdj: markdown with a JSON block per system). An entry
# without hostname and ip is a product you only want watched. The format
# follows the file extension: .mdj or .md, .csv, .json, .yaml.
inventory:
  file: ~/.config/ais/inventory.mdj

# Field policy. Unknown columns are dropped.
fields:
  title: scrub                  # mdj heading: a role, or a hostname
  count: clear                  # installs an entry stands for
  hostname: pseudonym
  ip: pseudonym
  site: pseudonym
  vendor: clear
  product: clear
  version: clear
  usage: scrub                  # mdj section "## Usage"
  interest: scrub               # mdj section "## Interest"
  comment: scrub                # CSV column
  owner_email: drop
  notes: drop

# What the model sees: distinct (vendor, product, version) tuples with a
# count, never a device. The MCP server offers only the minimized tools.
expose:
  prompt:
    groupBy: [vendor, product, version]
    collect: [usage, interest, comment]
  mcp:
    tools: [inventory_products, results_recent]

tools: [WebFetch, WebSearch]
allowedTools: [WebFetch, WebSearch, "mcp__inventory__*"]

# The host reads these feeds before each scheduled run and hands the model
# only the items that no earlier run evaluated; an hour without a new item
# starts no container. Once a day, at fullSchedule, the run is the full
# check with web search, which also covers sources without a feed (Citrix,
# F5, GitHub advisories). 'ais feeds test vuln-watch' shows what the feeds
# return. 'ais run vuln-watch --full' forces a full check.
feeds:
  fullSchedule: "7 20 * * *"
  maxRunsPerDay: 12             # scheduled feed checks that may start the model in 24 h
  urls:
    - https://feeds.feedburner.com/TheHackersNews
    - https://www.cert.at/cert-at.de.warnings.rss_2.0.xml
    - https://www.cert.at/cert-at.de.all.rss_2.0.xml
    - https://www.heise.de/security/rss/alert-news-atom.xml
    - https://www.heise.de/security/rss/news-atom.xml
    - https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    - https://www.cisa.gov/cybersecurity-advisories/all.xml
    - https://cert.europa.eu/publications/security-advisories-rss
    - https://www.infosecurity-magazine.com/rss/news/
    - https://www.reddit.com/r/netsec/.rss
    - https://security.paloaltonetworks.com/rss.xml
    - https://sec.cloudapps.cisco.com/security/center/psirtrss20/CiscoSecurityAdvisory.xml
    - https://www.fortiguard.com/rss/ir.xml
    - https://api.msrc.microsoft.com/update-guide/rss
    - https://github.com/keycloak/keycloak/releases.atom
    - https://labs.watchtowr.com/rss/
    - https://www.rapid7.com/blog/rss/
    - https://unit42.paloaltonetworks.com/feed/
    - https://www.horizon3.ai/feed/
    - https://blog.talosintelligence.com/rss/
    - https://www.tenable.com/blog/feed
    - https://www.greynoise.io/blog/rss.xml

# WebFetch runs inside the container, so every feed host must be listed.
# WebSearch is server-side and needs nothing here. A leading dot allows the
# domain and every subdomain (squid dstdomain). Redirects to CDNs show up in
# 'ais egress denied'; add them here when a source needs one.
egress:
  allow:
    # primary monitored sources
    - .thehackernews.com
    - feeds.feedburner.com          # The Hacker News RSS
    - .cert.at
    - .heise.de
    # exploitation and vulnerability catalogues
    - .cisa.gov                     # Known Exploited Vulnerabilities
    - .cert.europa.eu               # CERT-EU
    - .infosecurity-magazine.com
    - .nvd.nist.gov                 # CVE details for verification
    - .reddit.com                   # r/cybersecurity and r/netsec RSS (/.rss)
    # vendor advisories used for verification
    - .cisco.com                    # sec.cloudapps.cisco.com and docs
    - .citrix.com                   # Citrix / NetScaler security bulletins
    - .netscaler.com
    - security.paloaltonetworks.com
    - .f5.com                       # my.f5.com
    - .keycloak.org                 # Keycloak security releases
    - .github.com                   # GitHub Security Advisories, Keycloak project
    - msrc.microsoft.com
    - fortiguard.fortinet.com
    # security research blogs
    - labs.watchtowr.com            # watchTowr Labs
    - .rapid7.com                   # Rapid7
    - unit42.paloaltonetworks.com   # Palo Alto Unit 42
    - .horizon3.ai                  # Horizon3.ai / NodeZero Research
    - .assetnote.io                 # Assetnote Research
    - .talosintelligence.com        # Cisco Talos
    - .tenable.com                  # Tenable Research
    - blog.qualys.com               # Qualys Threat Research Unit
    - cloud.google.com              # Mandiant / Google Threat Intelligence blog
    - .greynoise.io                 # GreyNoise
    - .vulncheck.com                # VulnCheck
    - .bishopfox.com                # Bishop Fox
    - .projectdiscovery.io          # ProjectDiscovery Research
    - .arcticwolf.com               # Arctic Wolf Labs
    - news.sophos.com               # Sophos X-Ops

# Extra redaction on top of the global pii policy (config.yaml), if any.
pii:
  redact:
    literals: []

prompt: |
  You are a vulnerability analyst. Today is {{ .Now.Format "2006-01-02" }} (run {{ .Run.ID }}).
  {{ if eq .Mode "feed" }}This is a feed check. The host read the news and advisory feeds and lists below the items
  that no earlier run has evaluated. Work only on these items. Do not browse the sources and do not
  search for other news. For each item, decide from its title and summary whether it can concern an
  inventoried product; skip the rest without fetching them. Fetch an item that can, verify it against
  the vendor advisory and NVD (use WebSearch only to find the advisory of that specific item), and
  report findings as described below.
  New items:
  {{ range .Feed }}- {{ .Source }}: {{ .Title }} — {{ .Link }}{{ with .Summary }} ({{ . }}){{ end }}
  {{ end }}{{ else }}This is the full daily check.
  Check these sources for vulnerabilities, zero-days and critical advisories published in the last 24 hours.
  Primary: The Hacker News (thehackernews.com, RSS at feeds.feedburner.com/TheHackersNews), CERT.at (cert.at),
  heise Security (heise.de/security). Catalogues: CISA Known Exploited Vulnerabilities (cisa.gov), CERT-EU (cert.europa.eu),
  Infosecurity Magazine, the r/cybersecurity and r/netsec feeds (reddit.com/r/<name>/.rss), GitHub Security Advisories.
  Verify against the vendor advisories: Cisco (sec.cloudapps.cisco.com), Citrix/NetScaler, Palo Alto Networks
  (security.paloaltonetworks.com), F5 (my.f5.com), Keycloak (keycloak.org and the project's GitHub advisories), and NVD for CVE details.
  {{ end }}Only report findings that affect one of these inventoried products; version ranges matter.
  Only report findings with severity critical or high. Drop medium and low findings; do not raise
  the severity of a finding to fit. Rate a vulnerability that is exploited in the wild as critical.
  The usage of a product tells you which features and interfaces are in use; drop a finding that needs
  a feature the usage rules out. When a product has an interest, report only findings that match it.
  Where a product gives no version, treat every currently supported version as in use and set
  installed_version to "unknown".
  Put indicator-of-compromise IP addresses, domains and URLs in iocs, one per entry, so that an
  operator can block them; do not list them in the summary.
  {{ range .Groups }}- {{ .Fields.vendor }} {{ .Fields.product }} {{ with .Fields.version }}{{ . }}{{ else }}(no version given){{ end }} ({{ .Count }} installs){{ with index .Collected "usage" }}; usage: {{ join . "; " }}{{ end }}{{ with index .Collected "interest" }}; interest: {{ join . "; " }}{{ end }}{{ with index .Collected "comment" }}; notes: {{ join . "; " }}{{ end }}
  {{ end }}{{ if .Text }}Free-text product list, without device records. Where a line gives no version, treat every
  currently supported version as in use and set installed_version to "unknown":
  {{ range .Text }}- {{ . }}
  {{ end }}{{ end }}
  Start with mcp__inventory__results_recent (limit 20). Each earlier result has findings (reported) and
  checked (advisories and news items that an earlier run already evaluated, with the verdict). Skip an item
  whose URL is in an earlier checked list or finding, unless the source shows an update after that run
  finished; then check it again.
  Report a finding that an earlier run reported again only when something material changed: it is now
  exploited in the wild, new indicators of compromise appeared, a fixed version became available or
  changed, the severity or CVSS rose, or the advisory now names more affected products. Then set
  previously_reported to true and write in update only what is new, in one or two sentences; fill the
  other fields as usual. A first-time finding has update null.
  A finding is closed when the inventory version of the product is the fixed version or newer. Compare
  the fixed version with the versions in the list above before you report; do not report a closed finding,
  and do not report an update for an earlier finding whose product the inventory shows as fixed.
  In checked, list every advisory or news item that you fetched and evaluated in this run, reported or
  dropped, with its URL, the product it concerns, and a short verdict (for example "reported", "version not
  affected", "medium severity", "product not in inventory", "fixed in inventory", "reported (update)").
  Do not list items that you skipped by title, and do not repeat items that an earlier run checked.
  For each finding fill title (one line, what the flaw is), cvss (base score, null when none is published),
  exploited (true only when a source reports exploitation in the wild), affected (which products, models or
  configurations are affected and which are not), action (what an operator should check or do, with the
  exact command or setting where the advisory gives one), and published (publication date, and the date of
  the last update when the advisory has one).
  Return an empty findings list when nothing relevant was published.

appendSystemPrompt: |
  Do not speculate. Every finding needs at least one source URL. Confidence is 0..1.

# checked is the memory of the task: the next run reads it through
# results_recent and skips what was already evaluated. Sinks show findings only.
outputSchema:
  type: object
  required: [findings, checked]
  additionalProperties: false
  properties:
    checked:
      type: array
      maxItems: 60
      items:
        type: object
        required: [url, product, verdict]
        additionalProperties: false
        properties:
          url: { type: string }
          product: { type: string, maxLength: 120 }
          verdict: { type: string, maxLength: 160 }
    findings:
      type: array
      items:
        type: object
        required: [product, title, affected_version_range, installed_version, cve_ids, severity, cvss, exploited,
                   source_urls, summary, affected, action, published, previously_reported, update, confidence]
        additionalProperties: false
        properties:
          vendor: { type: string }
          product: { type: string }
          title: { type: string, maxLength: 120 }
          affected_version_range: { type: string }
          installed_version: { type: string }
          fixed_version: { type: [string, "null"] }
          cve_ids:
            type: array
            items: { type: string, pattern: "^CVE-[0-9]{4}-[0-9]{4,}$" }
          severity: { type: string, enum: [critical, high] }
          cvss: { type: [number, "null"], minimum: 0, maximum: 10 }
          exploited: { type: boolean }
          source_urls: { type: array, minItems: 1, items: { type: string } }
          summary: { type: string, maxLength: 1200 }
          affected: { type: string, maxLength: 600 }
          action: { type: string, maxLength: 600 }
          published: { type: string, maxLength: 120 }
          previously_reported: { type: boolean }
          update: { type: [string, "null"], maxLength: 400 }
          iocs:
            type: array
            maxItems: 30
            items: { type: string, maxLength: 200 }
          confidence: { type: number, minimum: 0, maximum: 1 }

# Host-side join after the run: attach device identity the model never saw.
enrich:
  - path: findings
    match: { product: product, installed_version: version }
    attach: { devices: [title, count, hostname, ip, site] }

# Daily summary when a day passes without a finding: how many runs, turns,
# tokens and dollars it took. It goes to the sinks below at 22:30, after the
# last run of the day. With findings in the window, nothing is sent (set
# always: true to get the summary anyway).
digest:
  schedule: "30 22 * * *"
  window: 24h

sinks: []
